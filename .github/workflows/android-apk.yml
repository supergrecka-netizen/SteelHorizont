name: Build SteelHorizon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          node --version
          sdkmanager --version

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"

          curl -fL --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -oq godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/godot"

          curl -fL --retry 3 -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p "$RUNNER_TEMP/godot/template_archive"
          unzip -oq templates.tpz -d "$RUNNER_TEMP/godot/template_archive"

          TEMPLATE_FILE="$(find "$RUNNER_TEMP/godot/template_archive" \
            -type f -name android_debug.apk -print -quit)"

          if [ -z "$TEMPLATE_FILE" ]; then
            echo "::error::android_debug.apk was not found in the template archive."
            find "$RUNNER_TEMP/godot/template_archive" -maxdepth 5 -type f
            exit 1
          fi

          TEMPLATE_SOURCE="$(dirname "$TEMPLATE_FILE")"
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DEST"
          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"

          test -s "$TEMPLATE_DEST/android_debug.apk"
          test -s "$TEMPLATE_DEST/android_release.apk"

          echo "Installed templates:"
          ls -lah "$TEMPLATE_DEST"

      - name: Find and extract Godot project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f -name project.godot \
            -not -path '*/.git/*' \
            -not -path '*/.godot/*' \
            -not -path '*/unpacked/*' \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            mkdir -p "$GITHUB_WORKSPACE/unpacked"

            python3 - <<'PY'
          import os
          import zipfile

          root = os.environ["GITHUB_WORKSPACE"]
          destination = os.path.join(root, "unpacked")

          for current, dirs, files in os.walk(root):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", ".godot", "unpacked"}
              ]

              for filename in files:
                  if not filename.lower().endswith(".zip"):
                      continue

                  archive = os.path.join(current, filename)

                  try:
                      with zipfile.ZipFile(archive) as z:
                          names = z.namelist()
                          project = next(
                              (
                                  name for name in names
                                  if name == "project.godot"
                                  or name.endswith("/project.godot")
                              ),
                              None
                          )

                          if not project:
                              continue

                          prefix = project.rsplit("/", 1)[0]
                          for item in names:
                              if prefix:
                                  if item.startswith(prefix + "/"):
                                      z.extract(item, destination)
                              else:
                                  z.extract(item, destination)

                          raise SystemExit(0)

                  except zipfile.BadZipFile:
                      continue

          raise SystemExit(
              "Could not find project.godot in the repository or ZIP files."
          )
          PY

            PROJECT_FILE="$(find "$GITHUB_WORKSPACE/unpacked" \
              -type f -name project.godot -print -quit)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Could not locate project.godot."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/build"

          cat > "$PROJECT_DIR/export_presets.cfg" <<'PRESET'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/SteelHorizon-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="org.godotengine.steelhorizon"
          package/name="SteelHorizon"
          package/signed=true
          screen/immersive_mode=true
          screen/support_small=true
          permissions/internet=true
          PRESET

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Enable Android texture import
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/project.godot" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          setting = "textures/vram_compression/import_etc2_astc=true"

          if setting not in content:
              if "[rendering]" in content:
                  content = content.replace(
                      "[rendering]",
                      "[rendering]\n" + setting,
                      1
                  )
              else:
                  content += "\n[rendering]\n" + setting + "\n"

              path.write_text(content, encoding="utf-8")

          print("Android ETC2/ASTC texture import setting applied.")
          PY

          grep -n -A 8 '^\[rendering\]' "$PROJECT_DIR/project.godot" || true

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT" \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --import \
            --verbose 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Diagnose Godot Android export configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Godot version:"
          "$GODOT" --version

          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"

          echo "Checking required paths..."
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

          echo "Checking project configuration..."
          "$GODOT" \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit \
            --verbose 2>&1 | tee "$RUNNER_TEMP/godot-diagnostics.log"

      - name: Export Android APK with detailed logs
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "$PROJECT_DIR/build"

          set +e
          "$GODOT" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/SteelHorizon-debug.apk" \
            --verbose 2>&1 | tee "$RUNNER_TEMP/godot-export.log"

          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$EXPORT_STATUS" -ne 0 ]; then
            echo "::error::Godot Android export failed. Relevant diagnostics follow."
            grep -inE \
              'error|warning|android|export|template|sdk|keystore|sign|invalid|failed' \
              "$RUNNER_TEMP/godot-export.log" | tail -n 100 || true

            echo "Full export log is available in the job output."
            exit "$EXPORT_STATUS"
          fi

          if [ ! -s "$PROJECT_DIR/build/SteelHorizon-debug.apk" ]; then
            echo "::error::Godot returned success but the APK file is missing."
            exit 1
          fi

          echo "APK created:"
          ls -lh "$PROJECT_DIR/build/SteelHorizon-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SteelHorizon-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/SteelHorizon-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SteelHorizon-build-diagnostics
          path: |
            ${{ runner.temp }}/godot-export.log
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
