
name: Build SteelHorizon Android APK

# ==========================================================
# STEELHORIZON — AUTOMATIC ANDROID APK BUILD
# Engine: Godot 4.3
# Platform: Android
# Output: SteelHorizon-debug.apk
# ==========================================================

# Запуск сборки:
# - автоматически при изменении архива игры или этого файла в main;
# - вручную через GitHub Actions.
on:
  push:
    branches:
      - main
    paths:
      - "SteelHorizon-Godot-Prototype.zip"
      - ".github/workflows/android-apk.yml"

  workflow_dispatch:

# Для сборки достаточно читать исходники репозитория.
permissions:
  contents: read

# Не допускаем параллельные сборки одного проекта.
concurrency:
  group: steelhorizon-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ====================================================
      # STEP 1 — Получение исходников
      # ====================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ====================================================
      # STEP 2 — Проверка ZIP-архива игры
      # ====================================================
      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="SteelHorizon-Godot-Prototype.zip"

          echo "Checking project archive..."

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Project archive not found: $ARCHIVE"
            echo "Place the ZIP archive in the repository root."
            exit 1
          fi

          if ! unzip -t "$ARCHIVE" >/dev/null; then
            echo "::error::The project ZIP archive is corrupted."
            exit 1
          fi

          echo "Project archive is present and valid."
          ls -lh "$ARCHIVE"

      # ====================================================
      # STEP 3 — Распаковка проекта Godot
      # ====================================================
      - name: Extract Godot project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p unpacked

          echo "Extracting project archive..."
          unzip -q SteelHorizon-Godot-Prototype.zip -d unpacked

          PROJECT_DIR="unpacked/SteelHorizon"

          if [[ ! -f "$PROJECT_DIR/project.godot" ]]; then
            echo "::error::project.godot was not found."
            echo "Expected path: $PROJECT_DIR/project.godot"
            echo "Files extracted from archive:"
            find unpacked -maxdepth 4 -type f | head -200
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/export_presets.cfg" ]]; then
            echo "::error::export_presets.cfg was not found."
            echo "Create an Android export preset in Godot."
            exit 1
          fi

          echo "Godot project extracted successfully."
          echo "Project directory: $PROJECT_DIR"

      # ====================================================
      # STEP 4 — Исправление Android-пресета Godot
      # ====================================================
      # Godot 4.3 требует включить Gradle Build, если
      # в Android-пресете переопределяются Min SDK и Target SDK.
      # Изменяется только распакованная копия проекта.
      - name: Fix Android Gradle export settings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          config = Path(
              "unpacked/SteelHorizon/export_presets.cfg"
          )

          lines = config.read_text(
              encoding="utf-8"
          ).splitlines()

          # Locate the Android export preset.
          current_preset = None
          android_preset = None

          for line in lines:
              section = re.fullmatch(
                  r"\[preset\.(\d+)\]",
                  line.strip()
              )

              if section:
                  current_preset = section.group(1)
                  continue

              if (
                  current_preset is not None
                  and line.strip() == 'name="Android"'
              ):
                  android_preset = current_preset
                  break

          if android_preset is None:
              print(
                  "::error::Android export preset "
                  "was not found in export_presets.cfg."
              )
              sys.exit(1)

          # Locate the options section for this preset.
          options_header = (
              f"[preset.{android_preset}.options]"
          )

          options_start = None

          for index, line in enumerate(lines):
              if line.strip() == options_header:
                  options_start = index
                  break

          if options_start is None:
              print(
                  f"::error::Missing section: {options_header}"
              )
              sys.exit(1)

          # Find where this options section ends.
          options_end = len(lines)

          for index in range(
              options_start + 1,
              len(lines)
          ):
              if re.match(
                  r"^\s*\[.+\]\s*$",
                  lines[index]
              ):
                  options_end = index
                  break

          # Enable Gradle Build.
          key = "gradle_build/use_gradle_build"
          setting_found = False

          for index in range(
              options_start + 1,
              options_end
          ):
              if re.match(
                  rf"^\s*{re.escape(key)}\s*=",
                  lines[index]
              ):
                  lines[index] = f"{key}=true"
                  setting_found = True
                  break

          if not setting_found:
              lines.insert(
                  options_start + 1,
                  f"{key}=true"
              )

          config.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Android preset: {android_preset}")
          print("Gradle Build enabled.")
          PY

      # ====================================================
      # STEP 5 — Установка Java 17
      # ====================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ====================================================
      # STEP 6 — Поиск уже установленного Android SDK
      # ====================================================
      # Не используем android-actions/setup-android@v3:
      # в предыдущем запуске он пытался установить пакет
      # "tools" и завершился с ошибкой.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory not found."
            echo "Expected SDK location: $SDK_ROOT"
            exit 1
          fi

          echo "Searching for sdkmanager..."

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Executable sdkmanager was not found."
            echo "Available command-line tools:"
            find "$SDK_ROOT/cmdline-tools" \
              -maxdepth 4 -type f \
              2>/dev/null | head -100 || true
            exit 1
          fi

          # Make the SDK paths available to subsequent steps.
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK root: $SDK_ROOT"
          echo "SDK manager: $SDKMANAGER"

      # ====================================================
      # STEP 7 — Установка Android SDK packages
      # ====================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Java installation..."
          java -version

          echo "Checking Android SDK..."
          echo "$ANDROID_HOME"

          if [[ ! -x "$ANDROID_SDKMANAGER" ]]; then
            echo "::error::sdkmanager is not executable."
            exit 1
          fi

          # Accept SDK licenses.
          set +o pipefail
          yes | "$ANDROID_SDKMANAGER" --licenses \
            >/dev/null 2>&1
          LICENSE_STATUS=$?
          set -o pipefail

          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "License command returned a non-zero status."
            echo "Continuing to package installation."
          fi

          # Install supported Android SDK components.
          # Do not request the obsolete package "tools".
          "$ANDROID_SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK packages installed successfully."

      # ====================================================
      # STEP 8 — Проверка Android-пресета
      # ====================================================
      - name: Validate project configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="unpacked/SteelHorizon"
          PRESETS="$PROJECT_DIR/export_presets.cfg"

          if [[ ! -f "$PROJECT_DIR/project.godot" ]]; then
            echo "::error::Godot project file is missing."
            exit 1
          fi

          if ! grep -q 'name="Android"' "$PRESETS"; then
            echo "::error::Android export preset is missing."
            exit 1
          fi

          if ! grep -q \
            'gradle_build/use_gradle_build=true' \
            "$PRESETS"; then
            echo "::error::Gradle Build is not enabled."
            exit 1
          fi

          echo "Project configuration validated."
          echo "Android export preset found."
          echo "Gradle Build enabled."

      # ====================================================
      # STEP 9 — Экспорт APK в Godot 4.3
      # ====================================================
      - name: Export Android APK with Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          # Match the version used by the game project.
          godot_version: 4.3
          godot_export_templates: 4.3.stable

          # Path to the directory containing project.godot.
          relative_project_path: ./unpacked/SteelHorizon

          # Must match the preset name in export_presets.cfg.
          presets_to_export: Android

          # Debug APK for installation and testing.
          export_debug: true

          # Cache engine and export resources where supported.
          cache: true

      # ====================================================
      # STEP 10 — Поиск и проверка APK
      # ====================================================
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="unpacked/SteelHorizon"
          EXPECTED_APK="$PROJECT_DIR/build/SteelHorizon-debug.apk"

          echo "Searching for exported APK..."

          # Search for APK files in case the exporter uses
          # a different output filename or directory.
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print || true

          if [[ ! -f "$EXPECTED_APK" ]]; then
            echo "::error::Expected APK was not found:"
            echo "$EXPECTED_APK"

            echo "Available APK files:"
            find unpacked \
              -type f \
              -name "*.apk" \
              -print || true

            echo "Project files:"
            find "$PROJECT_DIR" \
              -maxdepth 4 \
              -type f \
              | head -200 || true

            exit 1
          fi

          if [[ ! -s "$EXPECTED_APK" ]]; then
            echo "::error::The generated APK is empty."
            exit 1
          fi

          echo "APK created successfully."
          ls -lh "$EXPECTED_APK"
          du -h "$EXPECTED_APK"

      # ====================================================
      # STEP 11 — Загрузка APK в GitHub Actions
      # ====================================================
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelHorizon-Android-APK
          path: unpacked/SteelHorizon/build/SteelHorizon-debug.apk
          if-no-files-found: error
          retention-days: 14
