
      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("unpacked/SteelHorizon/export_presets.cfg")
          lines = path.read_text(encoding="utf-8").splitlines()

          def section_end(start):
              for i in range(start + 1, len(lines)):
                  if re.match(r"^\s*\[.+\]\s*$", lines[i]):
                      return i
              return len(lines)

          # Найти Android-пресет.
          preset_id = None
          preset_start = None

          for i, line in enumerate(lines):
              match = re.fullmatch(r"\[preset\.(\d+)\]", line.strip())
              if not match:
                  continue

              end = section_end(i)
              if any(x.strip() == 'name="Android"' for x in lines[i + 1:end]):
                  preset_id = match.group(1)
                  preset_start = i
                  break

          if preset_id is None:
              print("::error::Android preset not found in export_presets.cfg")
              sys.exit(1)

          # Задать путь для готового APK.
          end = section_end(preset_start)
          found = False

          for i in range(preset_start + 1, end):
              if re.match(r"^\s*export_path\s*=", lines[i]):
                  lines[i] = 'export_path="build/SteelHorizon-debug.apk"'
                  found = True
                  break

          if not found:
              lines.insert(
                  preset_start + 1,
                  'export_path="build/SteelHorizon-debug.apk"'
              )

          # Найти секцию параметров Android.
          header = f"[preset.{preset_id}.options]"
          options_start = next(
              (i for i, line in enumerate(lines) if line.strip() == header),
              None
          )

          if options_start is None:
              print(f"::error::Missing section {header}")
              sys.exit(1)

          # Исправить основные параметры Android-экспорта.
          settings = {
              "gradle_build/use_gradle_build": "true",
              "package/unique_name": '"org.godotengine.steelhorizon"',
              "version/code": "1",
              "version/name": '"1.0.0"',
              "architectures/armeabi-v7a": "false",
              "architectures/arm64-v8a": "true",
              "architectures/x86": "false",
              "architectures/x86_64": "false",
              "gradle_build/min_sdk": '"23"',
              "gradle_build/target_sdk": '"34"',
          }

          for key, value in settings.items():
              start = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == header
              )
              end = section_end(start)
              pattern = re.compile(
                  r"^\s*" + re.escape(key) + r"\s*="
              )

              existing = next(
                  (
                      i for i in range(start + 1, end)
                      if pattern.match(lines[i])
                  ),
                  None
              )

              replacement = f"{key}={value}"

              if existing is None:
                  lines.insert(end, replacement)
              else:
                  lines[existing] = replacement

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Android export preset configured:")
          for key, value in settings.items():
              print(f"{key} = {value}")
          PY
