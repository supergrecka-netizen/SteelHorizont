
name: Build SteelHorizon Android APK

on:
  push:
    branches:
      - main
    paths:
      - "SteelHorizon-Godot-Prototype.zip"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steelhorizon-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Скачать репозиторий
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Проверить архив проекта
      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="SteelHorizon-Godot-Prototype.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Не найден архив $ARCHIVE"
            exit 1
          fi

          if ! unzip -t "$ARCHIVE" >/dev/null; then
            echo "::error::ZIP-архив повреждён"
            exit 1
          fi

          echo "Архив проекта проверен."
          ls -lh "$ARCHIVE"

      # 3. Распаковать проект Godot
      - name: Extract Godot project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p unpacked
          unzip -q SteelHorizon-Godot-Prototype.zip -d unpacked

          PROJECT_DIR="unpacked/SteelHorizon"

          if [[ ! -f "$PROJECT_DIR/project.godot" ]]; then
            echo "::error::Не найден project.godot"
            find unpacked -maxdepth 4 -type f | head -200
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/export_presets.cfg" ]]; then
            echo "::error::Не найден export_presets.cfg"
            exit 1
          fi

          echo "Проект распакован: $PROJECT_DIR"

      # 4. Исправить Android-пресет и путь экспорта
      - name: Fix Android export settings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          config = Path(
              "unpacked/SteelHorizon/export_presets.cfg"
          )

          lines = config.read_text(
              encoding="utf-8"
          ).splitlines()

          # Найти пресет Android.
          preset_id = None
          preset_start = None

          for i, line in enumerate(lines):
              match = re.fullmatch(
                  r"\[preset\.(\d+)\]",
                  line.strip()
              )

              if match:
                  current_id = match.group(1)

                  # Имя пресета находится в его секции.
                  end = len(lines)

                  for j in range(i + 1, len(lines)):
                      if re.match(
                          r"^\s*\[.+\]\s*$",
                          lines[j]
                      ):
                          end = j
                          break

                  section = lines[i + 1:end]

                  if any(
                      x.strip() == 'name="Android"'
                      for x in section
                  ):
                      preset_id = current_id
                      preset_start = i
                      break

          if preset_id is None:
              print(
                  "::error::Не найден Android-пресет "
                  "в export_presets.cfg"
              )
              sys.exit(1)

          # Установить предсказуемый путь APK.
          preset_end = len(lines)

          for i in range(preset_start + 1, len(lines)):
              if re.match(
                  r"^\s*\[.+\]\s*$",
                  lines[i]
              ):
                  preset_end = i
                  break

          export_key = "export_path"
          export_value = (
              'export_path="build/SteelHorizon-debug.apk"'
          )
          export_found = False

          for i in range(preset_start + 1, preset_end):
              if re.match(
                  r"^\s*export_path\s*=",
                  lines[i]
              ):
                  lines[i] = export_value
                  export_found = True
                  break

          if not export_found:
              lines.insert(preset_start + 1, export_value)

          # Найти настройки Android-пресета.
          options_header = (
              f"[preset.{preset_id}.options]"
          )
          options_start = None

          for i, line in enumerate(lines):
              if line.strip() == options_header:
                  options_start = i
                  break

          if options_start is None:
              print(
                  f"::error::Не найдена секция {options_header}"
              )
              sys.exit(1)

          options_end = len(lines)

          for i in range(options_start + 1, len(lines)):
              if re.match(
                  r"^\s*\[.+\]\s*$",
                  lines[i]
              ):
                  options_end = i
                  break

          gradle_key = "gradle_build/use_gradle_build"
          gradle_found = False

          for i in range(options_start + 1, options_end):
              if re.match(
                  rf"^\s*{re.escape(gradle_key)}\s*=",
                  lines[i]
              ):
                  lines[i] = f"{gradle_key}=true"
                  gradle_found = True
                  break

          if not gradle_found:
              lines.insert(
                  options_start + 1,
                  f"{gradle_key}=true"
              )

          config.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Android preset: {preset_id}")
          print("Gradle Build включён.")
          print("Путь APK: build/SteelHorizon-debug.apk")
          PY

      # 5. Установить Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 6. Найти Android SDK
      # Не используем android-actions/setup-android@v3:
      # предыдущая сборка падала на устаревшем пакете tools.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Не найден Android SDK: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Не найден исполняемый sdkmanager"
            find "$SDK_ROOT/cmdline-tools" \
              -maxdepth 4 -type f \
              2>/dev/null | head -100 || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"

      # 7. Установить компоненты Android SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          java -version

          if [[ ! -x "$ANDROID_SDKMANAGER" ]]; then
            echo "::error::sdkmanager недоступен"
            exit 1
          fi

          # Принять лицензии SDK.
          set +o pipefail
          yes | "$ANDROID_SDKMANAGER" --licenses \
            >/dev/null 2>&1
          LICENSE_STATUS=$?
          set -o pipefail

          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "Предупреждение при принятии лицензий."
          fi

          # Не устанавливаем устаревший пакет "tools".
          "$ANDROID_SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK components готовы."

      # 8. Проверить конфигурацию проекта
      - name: Validate project configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="unpacked/SteelHorizon"
          PRESETS="$PROJECT_DIR/export_presets.cfg"

          test -f "$PROJECT_DIR/project.godot"

          if ! grep -q 'name="Android"' "$PRESETS"; then
            echo "::error::Android-пресет отсутствует"
            exit 1
          fi

          if ! grep -q \
            'gradle_build/use_gradle_build=true' \
            "$PRESETS"; then
            echo "::error::Gradle Build не включён"
            exit 1
          fi

          if ! grep -q \
            'export_path="build/SteelHorizon-debug.apk"' \
            "$PRESETS"; then
            echo "::error::Путь экспорта APK не настроен"
            exit 1
          fi

          echo "Настройки проекта проверены."

      # 9. Скачать Godot 4.3 и экспортировать APK
      - name: Export Android APK with Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          # В v8.0.0 используются URL, а не godot_version.
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          relative_project_path: ./unpacked/SteelHorizon
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true
          verbose: true

      # 10. Проверить готовый APK
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="unpacked/SteelHorizon"
          APK="$PROJECT_DIR/build/SteelHorizon-debug.apk"

          echo "Поиск созданных APK..."
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print || true

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK не найден по ожидаемому пути: $APK"
            echo "Найденные APK:"
            find unpacked -type f -name "*.apk" -print || true
            exit 1
          fi

          if [[ ! -s "$APK" ]]; then
            echo "::error::Файл APK пустой"
            exit 1
          fi

          echo "APK успешно создан!"
          ls -lh "$APK"

      # 11. Загрузить APK как артефакт GitHub Actions
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelHorizon-Android-APK
          path: unpacked/SteelHorizon/build/SteelHorizon-debug.apk
          if-no-files-found: error
          retention-days: 14
