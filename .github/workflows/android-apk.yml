name: Build SteelHorizon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"

          curl -fL --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -oq godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/godot"

          curl -fL --retry 3 -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -oq templates.tpz -d "$RUNNER_TEMP/godot/templates"

          TEMPLATE_DIR="$(find "$RUNNER_TEMP/godot/templates" -type d -name '4.3.stable' -print -quit)"

          if [ -z "$TEMPLATE_DIR" ]; then
            echo "::error::Godot export templates not found."
            exit 1
          fi

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a "$TEMPLATE_DIR/." "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Find Godot project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f -name project.godot \
            -not -path '*/.git/*' \
            -not -path '*/.godot/*' \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            mkdir -p "$GITHUB_WORKSPACE/unpacked"

            python3 - <<'PY'
          import os
          import zipfile

          root = os.environ["GITHUB_WORKSPACE"]
          destination = os.path.join(root, "unpacked")

          for current, dirs, files in os.walk(root):
              dirs[:] = [d for d in dirs if d not in {".git", ".godot", "unpacked"}]
              for filename in files:
                  if not filename.lower().endswith(".zip"):
                      continue
                  archive = os.path.join(current, filename)
                  try:
                      with zipfile.ZipFile(archive) as z:
                          names = z.namelist()
                          project = next((n for n in names if n.endswith("project.godot")), None)
                          if project:
                              prefix = project.rsplit("/", 1)[0]
                              for item in names:
                                  if item.startswith(prefix + "/"):
                                      z.extract(item, destination)
                              raise SystemExit(0)
                  except zipfile.BadZipFile:
                      pass

          raise SystemExit("No project.godot found in repository or ZIP archives.")
          PY

            PROJECT_FILE="$(find "$GITHUB_WORKSPACE/unpacked" -type f -name project.godot -print -quit)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Could not find project.godot."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/build"

          cat > "$PROJECT_DIR/export_presets.cfg" <<'PRESET'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/SteelHorizon-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="org.godotengine.steelhorizon"
          package/name="SteelHorizon"
          package/signed=false
          screen/immersive_mode=true
          screen/support_small=true
          permissions/internet=true
          PRESET

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot project
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path "$PROJECT_DIR" --import

      - name: Export Android APK
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build"

          "$GODOT" --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/SteelHorizon-debug.apk"

          test -s "$PROJECT_DIR/build/SteelHorizon-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SteelHorizon-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/SteelHorizon-debug.apk
          if-no-files-found: error
          retention-days: 14
