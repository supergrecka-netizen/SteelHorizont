
name: Steel Horizon - Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Steel Horizon for Android
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail
          test -s SteelHorizon-Godot-Prototype.zip
          echo "Project archive found."
          unzip -l SteelHorizon-Godot-Prototype.zip

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          unzip -q SteelHorizon-Godot-Prototype.zip -d unpacked
          test -f unpacked/SteelHorizon/project.godot
          test -f unpacked/SteelHorizon/export_presets.cfg
          echo "Godot project found."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Пакет "tools" устарел и ломал предыдущую сборку.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "Android SDK packages installed."

      - name: Verify Android export preset
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="Android"' unpacked/SteelHorizon/export_presets.cfg
          grep -q 'platform="Android"' unpacked/SteelHorizon/export_presets.cfg
          echo "Android export preset found."

      - name: Export Godot project
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./unpacked/SteelHorizon
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="unpacked/SteelHorizon/build/SteelHorizon-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            find unpacked/SteelHorizon -maxdepth 4 -type f
            exit 1
          fi

          file "$APK"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SteelHorizon-Android-APK
          path: unpacked/SteelHorizon/build/SteelHorizon-debug.apk
          if-no-files-found: error
          retention-days: 14
