
name: Build SteelHorizon Android APK

# Запуск:
# 1. При изменениях в main
# 2. Вручную через вкладку Actions
on:
  push:
    branches:
      - main
    paths:
      - "SteelHorizon-Godot-Prototype.zip"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

# Разрешаем только чтение исходников репозитория.
permissions:
  contents: read

# Не запускаем несколько сборок одновременно.
concurrency:
  group: steelhorizon-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # --------------------------------------------------
      # 1. Получаем файлы репозитория
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Проверяем архив игры
      # --------------------------------------------------
      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="SteelHorizon-Godot-Prototype.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Не найден архив $ARCHIVE в корне репозитория."
            echo "Проверь название ZIP-файла и его расположение."
            exit 1
          fi

          echo "Архив проекта найден:"
          ls -lh "$ARCHIVE"

      # --------------------------------------------------
      # 3. Распаковываем Godot-проект
      # --------------------------------------------------
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p unpacked
          unzip -q SteelHorizon-Godot-Prototype.zip -d unpacked

          PROJECT_DIR="unpacked/SteelHorizon"

          if [[ ! -f "$PROJECT_DIR/project.godot" ]]; then
            echo "::error::Не найден unpacked/SteelHorizon/project.godot"
            echo "Содержимое распакованного архива:"
            find unpacked -maxdepth 4 -type f | head -200
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/export_presets.cfg" ]]; then
            echo "::error::Не найден export_presets.cfg."
            echo "Для экспорта Android необходим пресет Godot."
            exit 1
          fi

          echo "Godot-проект успешно распакован."
          echo "Путь: $PROJECT_DIR"

      # --------------------------------------------------
      # 4. Исправляем настройки Android-пресета
      # --------------------------------------------------
      # В предыдущей сборке Godot сообщал, что Min SDK
      # и Target SDK нельзя переопределять без Gradle.
      # Исправление применяется к распакованной копии,
      # оригинальный ZIP в репозитории не изменяется.
      - name: Fix Android Gradle export settings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          cfg = Path("unpacked/SteelHorizon/export_presets.cfg")
          lines = cfg.read_text(encoding="utf-8").splitlines()

          # Находим номер пресета с именем Android.
          current_preset = None
          android_preset = None

          for line in lines:
              section = re.fullmatch(
                  r"\[preset\.(\d+)\]",
                  line.strip()
              )

              if section:
                  current_preset = section.group(1)
                  continue

              if (
                  current_preset is not None
                  and line.strip() == 'name="Android"'
              ):
                  android_preset = current_preset
                  break

          if android_preset is None:
              print(
                  "::error::В export_presets.cfg "
                  "не найден пресет с именем Android."
              )
              sys.exit(1)

          options_header = f"[preset.{android_preset}.options]"
          options_start = None

          for i, line in enumerate(lines):
              if line.strip() == options_header:
                  options_start = i
                  break

          if options_start is None:
              print(
                  f"::error::Не найден раздел {options_header}"
              )
              sys.exit(1)

          # Определяем конец раздела настроек.
          options_end = len(lines)

          for i in range(options_start + 1, len(lines)):
              if re.match(r"^\s*\[.+\]\s*$", lines[i]):
                  options_end = i
                  break

          key = "gradle_build/use_gradle_build"
          found = False

          for i in range(options_start + 1, options_end):
              if re.match(
                  rf"^\s*{re.escape(key)}\s*=",
                  lines[i]
              ):
                  lines[i] = f"{key}=true"
                  found = True
                  break

          if not found:
              lines.insert(options_start + 1, f"{key}=true")

          cfg.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Android preset: {android_preset}")
          print("Gradle Build enabled successfully.")
          PY

      # --------------------------------------------------
      # 5. Устанавливаем Java
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 6. Устанавливаем Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "Android SDK location:"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-не указан}}"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::Команда sdkmanager не найдена."
            exit 1
          fi

          # Принимаем лицензии Android SDK.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # Устанавливаем платформу и инструменты Android 34.
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK packages installed."

      # --------------------------------------------------
      # 7. Проверяем Android-пресет до экспорта
      # --------------------------------------------------
      - name: Validate project configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="unpacked/SteelHorizon"
          PRESETS="$PROJECT_DIR/export_presets.cfg"

          if ! grep -q 'name="Android"' "$PRESETS"; then
            echo "::error::Пресет Android отсутствует."
            exit 1
          fi

          if ! grep -q \
            'gradle_build/use_gradle_build=true' \
            "$PRESETS"; then
            echo "::error::Gradle Build не включён."
            exit 1
          fi

          echo "Project configuration looks valid."
          echo "Android preset found."
          echo "Gradle Build enabled."

      # --------------------------------------------------
      # 8. Экспортируем APK через Godot 4.3
      # --------------------------------------------------
      - name: Export Android APK with Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          # Версия движка, под которую сделан проект.
          godot_version: 4.3
          godot_export_templates: 4.3.stable

          # Путь к project.godot внутри распакованного ZIP.
          relative_project_path: ./unpacked/SteelHorizon

          # Имя экспортного пресета из Godot.
          presets_to_export: Android

          # Собираем debug APK для установки и тестирования.
          export_debug: true

          # Кэшируем шаблоны, чтобы повторные сборки
          # могли выполняться быстрее.
          cache: true

      # --------------------------------------------------
      # 9. Проверяем готовый APK
      # --------------------------------------------------
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="unpacked/SteelHorizon/build/SteelHorizon-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK не найден по ожидаемому пути:"
            echo "$APK"
            echo ""
            echo "Ищем все APK-файлы, созданные при экспорте:"
            find unpacked -type f -name "*.apk" -print || true
            echo ""
            echo "Также проверяем содержимое каталога проекта:"
            find unpacked/SteelHorizon -maxdepth 4 -type f \
              | head -200 || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

          echo "APK size:"
          du -h "$APK"

      # --------------------------------------------------
      # 10. Загружаем APK как артефакт GitHub Actions
      # --------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SteelHorizon-Android-APK
          path: unpacked/SteelHorizon/build/SteelHorizon-debug.apk
          if-no-files-found: error
          retention-days: 14
